name: Aktualizacja ofert partnerskich

on:
  push:
    branches: [main]
    paths: [".catalog-rebuild"]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: partner-catalog-update
  cancel-in-progress: false

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Sprawdź składnię i testy importerów
        run: |
          python3 -m py_compile scripts/update_ceneo.py scripts/update_awin.py scripts/update_price_history.py
          python3 -m unittest discover -s tests -v
          python3 -m py_compile scripts/publish_catalog.py
          node --check app.js
          node --check price-features.js

      - name: Pobierz produkty z feedu Awin (jeśli skonfigurowano dostęp)
        env:
          AWIN_FEED_URL: ${{ secrets.AWIN_FEED_URL }}
          AWIN_FEED_ALLOWED_HOSTS: ${{ vars.AWIN_FEED_ALLOWED_HOSTS }}
          AWIN_ALLOWED_PRODUCT_HOSTS: ${{ vars.AWIN_ALLOWED_PRODUCT_HOSTS }}
          AWIN_ALLOWED_IMAGE_HOSTS: ${{ vars.AWIN_ALLOWED_IMAGE_HOSTS }}
        run: python3 scripts/update_awin.py
        continue-on-error: true

      - name: Pobierz produkty z Ceneo (wyłącznie po zatwierdzeniu integracji)
        env:
          CENEO_API_KEY: ${{ secrets.CENEO_API_KEY }}
          CENEO_PARTNER_ID: ${{ secrets.CENEO_PARTNER_ID }}
          CENEO_API_PUBLICATION_APPROVED: ${{ secrets.CENEO_API_PUBLICATION_APPROVED }}
          CENEO_SEARCH_TERMS: ${{ vars.CENEO_SEARCH_TERMS }}
        run: python3 scripts/update_ceneo.py

      - name: Zapisz dzienną historię cen
        run: python3 scripts/update_price_history.py

      - name: Podziel katalog i historię na pliki publikacyjne
        run: python3 scripts/publish_catalog.py

      - name: Zapisz zaktualizowany katalog i historię
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch products.json price-history.json
          git add -A data/catalog data/price-history
          if ! git diff --cached --quiet; then
            git commit -m "Aktualizacja katalogu i historii cen (podzielone dane)"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Katalog opublikowany poprawnie."
                exit 0
              fi
              echo "Push odrzucony (próba ${attempt}/3); ponawiam synchronizację."
            done
            echo "Nie udało się opublikować katalogu po 3 próbach."
            exit 1
          else
            echo "Brak zmian w katalogu i historii cen."
          fi
