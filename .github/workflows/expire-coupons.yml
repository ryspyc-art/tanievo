name: Automatyczne czyszczenie kuponów

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-coupons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate and remove expired coupons
        run: python scripts/expire_coupons.py --prune
      - name: Commit cleanup if needed
        run: |
          if git diff --quiet -- kupony.json; then
            echo "No expired coupons to remove."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add kupony.json
            git commit -m "chore: remove expired coupons automatically"
            git push
          fi
